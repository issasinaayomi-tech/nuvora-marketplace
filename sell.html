/* =====================================================

const stateSelect =

    document.getElementById("lga");

    document.getElementById("message");

    document.getElementById("submitButton");

const pageSubtitle =
    document.getElementById("pageSubtitle");

const editMode =
    document.getElementById("editMode");


/* =====================================================
   EDIT ID
===================================================== */

const urlParams =
    new URLSearchParams(window.location.search);

const editId =
    urlParams.get("edit");


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(text, type) {

    message.textContent = text;

    message.className =
        "message " + type;
}


/* =====================================================
   LOAD STATES
===================================================== */

function loadStates() {

    stateSelect.innerHTML =
        '<option value="">Select your state</option>';

    Object.keys(nigeriaLocations)
        .sort()
        .forEach(function(state) {

            const option =
                document.createElement("option");

            option.value = state;

            option.textContent = state;

            stateSelect.appendChild(option);
        });
}


/* =====================================================
   LOAD LGAs
===================================================== */

function loadLGAs(state, selectedLGA = "") {

    lgaSelect.innerHTML =
        '<option value="">Select your LGA</option>';

    if (!state) {

        lgaSelect.disabled = true;

        return;
    }

    const lgas =
        nigeriaLocations[state] || [];

    lgas.forEach(function(lga) {

        const option =
            document.createElement("option");

        option.value = lga;

        option.textContent = lga;

        if (lga === selectedLGA) {

            option.selected = true;
        }

        lgaSelect.appendChild(option);
    });

    lgaSelect.disabled = false;
}


/* =====================================================
   STATE CHANGE
===================================================== */

stateSelect.addEventListener(
    "change",
    function() {

        loadLGAs(
            stateSelect.value
        );
    }
);


/* =====================================================
   LOAD PRODUCT FOR EDITING
===================================================== */

async function loadProductForEditing() {

    if (!editId) {
        return;
    }

    try {

        const {
            data: { user },
            error: userError
        } =
            await supabaseClient.auth.getUser();


        if (userError || !user) {

            showMessage(
                "Please log in to edit a product.",
                "error"
            );

            return;
        }


        const {
            data: product,
            error
        } =
            await supabaseClient
            .from("products")
            .select("*")
            .eq("id", editId)
            .eq("seller_id", user.id)
            .single();


        if (error || !product) {

            showMessage(
                "Product not found or you do not have permission to edit it.",
                "error"
            );

            return;
        }


        pageTitle.textContent =
            "Edit Product";

        pageSubtitle.textContent =
            "Update your product information.";

        editMode.style.display =
            "block";

        submitButton.textContent =
            "Update Product";

        cancelButton.style.display =
            "block";


        document.getElementById("productName").value =
            product.name || "";

        document.getElementById("description").value =
            product.description || "";

        document.getElementById("price").value =
            product.price || "";

        document.getElementById("category").value =
            product.category || "";

        document.getElementById("stock").value =
            product.stock ?? "";

        document.getElementById("imageUrl").value =
            product.image_url || "";


        stateSelect.value =
            product.state || "";


        loadLGAs(
            product.state || "",
            product.city || ""
        );


    } catch (error) {

        console.error(error);

        showMessage(
            "Unable to load product.",
            "error"
        );
    }
}

                );


            const imageUrl =
                document.getElementById(
                    "imageUrl"
                ).value.trim();


            if (
                !productName ||
                !description ||
                !price ||
                !category ||
                !state ||
                !lga ||
                stock < 0 ||
                !imageUrl
            ) {

                showMessage(
                    "Please complete all fields.",
                    "error"
                );

                submitButton.disabled =
                    false;

                return;
            }


            const product = {

                name: productName,

                description: description,

                price: price,

                category: category,

                country: "Nigeria",

                state: state,

                city: lga,

                stock: stock,

                image_url: imageUrl

            };


            let result;


            /* =================================================
               UPDATE EXISTING PRODUCT
            ================================================= */

            if (editId) {

                result =
                    await supabaseClient
                    .from("products")
                    .update(product)
                    .eq("id", editId)
                    .eq("seller_id", user.id);

            }


            /* =================================================
               CREATE NEW PRODUCT
            ================================================= */

            else {

                product.seller_id =
                    user.id;

                result =
                    await supabaseClient
                    .from("products")
                    .insert(product);
            }


            if (result.error) {

                console.error(
                    result.error
                );

                showMessage(
                    "Unable to save product: " +
                    result.error.message,
                    "error"
                );

                submitButton.disabled =
                    false;

                return;
            }


            showMessage(
                editId
                    ? "Product updated successfully!"
                    : "Product added successfully!",
                "success"
            );


            if (editId) {

                setTimeout(
                    function() {

                        window.location.href =
                            "seller-dashboard.html";

                    },
                    1000
                );

            } else {

                sellForm.reset();

                lgaSelect.innerHTML =
                    '<option value="">Select your state first</option>';

                lgaSelect.disabled =
                    true;

                submitButton.disabled =
                    false;
            }


        } catch (error) {

            console.error(error);

            showMessage(
                "Something went wrong: " +
                error.message,
                "error"
            );

            submitButton.disabled =
                false;
        }
    }
);


/* =====================================================
   CANCEL EDIT
===================================================== */

cancelButton.addEventListener(
    "click",
    function() {

        window.location.href =
            "seller-dashboard.html";

    }
);


/* =====================================================
   START
===================================================== */

loadStates();

loadProductForEditing();

</script>

</body>
