<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>NUVORA - Cart</title>

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: Arial, sans-serif;
    background: #f5f7fb;
    color: #111827;
}

/* HEADER */

header {
    background: #111827;
    color: white;
    padding: 18px 5%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
}

.logo {
    font-size: 24px;
    font-weight: bold;
}

nav {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

nav a {
    color: white;
    text-decoration: none;
}

.auth-area {
    display: flex;
    align-items: center;
    gap: 10px;
}

.auth-link {
    color: white;
    text-decoration: none;
}

.signup-link {
    background: #2563eb;
    padding: 8px 12px;
    border-radius: 8px;
}

.user-name {
    font-weight: bold;
}

.logout-btn {
    border: none;
    background: #ef4444;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
}

/* MAIN */

.container {
    max-width: 900px;
    margin: 30px auto;
    padding: 20px;
}

h1 {
    margin-bottom: 25px;
}

.cart-item {
    background: white;
    padding: 15px;
    margin-bottom: 15px;
    border-radius: 12px;
    display: flex;
    align-items: center;
    gap: 20px;
}

.cart-image {
    width: 100px;
    height: 100px;
    object-fit: contain;
    background: #f3f4f6;
    border-radius: 10px;
}

.item-info {
    flex: 1;
}

.item-name {
    font-size: 18px;
    font-weight: bold;
    margin-bottom: 8px;
}

.item-price {
    margin-bottom: 8px;
}

.quantity {
    display: flex;
    align-items: center;
    gap: 10px;
}

.quantity button {
    border: none;
    background: #111827;
    color: white;
    width: 30px;
    height: 30px;
    border-radius: 6px;
    cursor: pointer;
}

.remove-btn {
    border: none;
    background: #dc2626;
    color: white;
    padding: 8px 12px;
    border-radius: 7px;
    cursor: pointer;
}

.summary {
    background: white;
    padding: 20px;
    border-radius: 12px;
    margin-top: 25px;
}

.total {
    font-size: 22px;
    font-weight: bold;
    margin-bottom: 15px;
}

.checkout-btn {
    width: 100%;
    padding: 15px;
    border: none;
    border-radius: 10px;
    background: #111827;
    color: white;
    font-size: 17px;
    cursor: pointer;
}

.empty {
    background: white;
    padding: 30px;
    text-align: center;
    border-radius: 12px;
}

.shop-btn {
    display: inline-block;
    margin-top: 15px;
    background: #111827;
    color: white;
    text-decoration: none;
    padding: 12px 18px;
    border-radius: 8px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        flex-direction: column;
    }

    .cart-item {
        flex-wrap: wrap;
    }

    .cart-image {
        width: 80px;
        height: 80px;
    }

    nav {
        gap: 8px;
        font-size: 14px;
        justify-content: center;
    }

}

</style>
</head>

<body>

<header>

    <div class="logo">
        NUVORA
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="sell.html">
            Sell
        </a>

        <div
            id="authArea"
            class="auth-area">
            Loading...
        </div>

    </nav>

</header>


<div class="container">

    <h1>
        🛒 Your Cart
    </h1>

    <div id="cartArea">
        Loading cart...
    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
    "https://rrkbgfdzktoeqiaktzcz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_XxydhD3XZ46n378xLbE22w_LTtgAtlV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================
   LOGIN SESSION
========================= */

async function checkUser() {

    const authArea =
        document.getElementById("authArea");

    const {
        data: { user },
        error
    } =
        await supabaseClient.auth.getUser();


    if (error) {

        authArea.innerHTML = `

            <a
                href="signup.html"
                class="auth-link signup-link">
                Sign Up
            </a>

            <a
                href="login.html"
                class="auth-link">
                Log In
            </a>

        `;

        return;
    }


    if (user) {

        const name =
            user.user_metadata?.full_name ||
            user.email?.split("@")[0] ||
            "User";


        authArea.innerHTML = `

            <span class="user-name">
                Hi, ${name}
            </span>

            <button
                class="logout-btn"
                onclick="logout()">
                Log Out
            </button>

        `;

    } else {

        authArea.innerHTML = `

            <a
                href="signup.html"
                class="auth-link signup-link">
                Sign Up
            </a>

            <a
                href="login.html"
                class="auth-link">
                Log In
            </a>

        `;

    }

}


/* =========================
   LOG OUT
========================= */

async function logout() {

    const { error } =
        await supabaseClient.auth.signOut();


    if (error) {

        alert(
            "Unable to log out: " +
            error.message
        );

        return;
    }


    window.location.reload();

}


/* =========================
   CART
========================= */

function getCart() {

    return JSON.parse(
        localStorage.getItem("nuvoraCart") || "[]"
    );

}


function saveCart(cart) {

    localStorage.setItem(
        "nuvoraCart",
        JSON.stringify(cart)
    );

}


/* =========================
   DISPLAY CART
========================= */

function displayCart() {

    const cart =
        getCart();

    const cartArea =
        document.getElementById("cartArea");


    if (cart.length === 0) {

        cartArea.innerHTML = `

            <div class="empty">

                <h2>
                    Your cart is empty
                </h2>

                <p>
                    Add products from the shop to see them here.
                </p>

                <a
                    href="products.html"
                    class="shop-btn">

                    Continue Shopping

                </a>

            </div>

        `;

        return;
    }


    let html = "";

    let total = 0;


    cart.forEach(function(item, index) {

        const price =
            Number(item.price) || 0;

        const quantity =
            Number(item.quantity) || 1;

        const itemTotal =
            price * quantity;

        total += itemTotal;


        html += `

            <div class="cart-item">

                <img
                    src="${item.image_url || ""}"
                    class="cart-image"
                    alt="${item.name || "Product"}"
                >


                <div class="item-info">

                    <div class="item-name">
                        ${item.name || "Product"}
                    </div>

                    <div class="item-price">
                        ₦${price.toLocaleString()}
                    </div>


                    <div class="quantity">

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, -1)">
                            −
                        </button>

                        <span>
                            ${quantity}
                        </span>

                        <button
                            type="button"
                            onclick="changeQuantity(${index}, 1)">
                            +
                        </button>

                    </div>

                </div>


                <button
                    type="button"
                    class="remove-btn"
                    onclick="removeItem(${index})">

                    Remove

                </button>

            </div>

        `;

    });


    html += `

        <div class="summary">

            <div class="total">

                Total:
                ₦${total.toLocaleString()}

            </div>


            <button
                type="button"
                class="checkout-btn"
                onclick="checkout()">

                Proceed to Checkout

            </button>

        </div>

    `;


    cartArea.innerHTML =
        html;

}


/* =========================
   CHANGE QUANTITY
========================= */

function changeQuantity(index, amount) {

    const cart =
        getCart();


    if (!cart[index]) {
        return;
    }


    cart[index].quantity =
        Number(cart[index].quantity) + amount;


    if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

    }


    saveCart(cart);

    displayCart();

}


/* =========================
   REMOVE ITEM
========================= */

function removeItem(index) {

    const cart =
        getCart();


    cart.splice(index, 1);

    saveCart(cart);

    displayCart();

}


/* =========================
   CHECKOUT
========================= */

function checkout() {

    const cart =
        getCart();


    if (cart.length === 0) {

        alert(
            "Your cart is empty."
        );

        return;
    }


    window.location.href =
        "checkout.html";

}


/* =========================
   START
========================= */

checkUser();

displayCart();

</script>

</body>
</html>
