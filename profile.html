<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUVORA - My Profile</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 20px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            gap: 20px;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        nav {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        .container {
            width: 92%;
            max-width: 650px;
            margin: 50px auto;
        }

        .profile-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.08);
            text-align: center;
        }

        .profile-picture {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;

            border: 4px solid #111827;

            margin-bottom: 15px;
        }

        .profile-placeholder {
            width: 120px;
            height: 120px;
            border-radius: 50%;

            background: #e5e7eb;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 50px;

            margin: 0 auto 15px;
        }

        h1 {
            margin-bottom: 8px;
        }

        .email {
            color: #6b7280;
            margin-bottom: 25px;
        }

        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"],
        input[type="file"] {
            width: 100%;
            padding: 12px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }

        input[type="file"] {
            background: #f9fafb;
        }

        button {
            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #111827;

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        .back-link {
            display: inline-block;

            margin-top: 20px;

            color: #111827;

            text-decoration: none;

            font-weight: bold;
        }

        @media (max-width: 500px) {

            header {
                flex-direction: column;
            }

            nav {
                flex-wrap: wrap;
                justify-content: center;
            }

            .profile-card {
                padding: 22px;
            }

        }

    </style>

</head>

<body>


<header>

    <div class="logo">
        NUVORA
    </div>

    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="products.html">
            Shop
        </a>

        <a href="sell.html">
            Sell
        </a>

    </nav>

</header>



<div class="container">

    <div class="profile-card">

        <div id="pictureArea">

            <div class="profile-placeholder">
                👤
            </div>

        </div>


        <h1 id="name">
            Loading...
        </h1>


        <p
            class="email"
            id="email"
        >
            Loading...
        </p>


        <div class="form-group">

            <label for="displayName">
                Display Name
            </label>

            <input
                type="text"
                id="displayName"
                placeholder="Enter your name"
            >

        </div>


        <div class="form-group">

            <label for="profilePicture">
                Profile Picture
            </label>

            <input
                type="file"
                id="profilePicture"
                accept="image/*"
            >

        </div>


        <button
            id="saveButton"
            onclick="saveProfile()"
        >
            Save Profile
        </button>


        <div
            id="message"
            class="message"
        ></div>


        <a
            href="index.html"
            class="back-link"
        >
            ← Back to Home
        </a>

    </div>

</div>



<script>

const SUPABASE_URL =
    "https://rrkbgfdzktoeqiaktzcz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_XxydhD3XZ46n378xLbE22w_LTtgAtlV";


const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


let currentUser = null;


async function loadProfile() {

    const {
        data: {
            user
        }
    } = await supabaseClient.auth.getUser();


    if (!user) {

        window.location.href =
            "login.html";

        return;

    }


    currentUser = user;


    document.getElementById("email").textContent =
        user.email || "";


    const {
        data: profile
    } =
        await supabaseClient
            .from("user_profiles")
            .select("*")
            .eq("id", user.id)
            .maybeSingle();


    const displayName =
        profile?.display_name ||
        user.user_metadata?.full_name ||
        user.email?.split("@")[0] ||
        "User";


    document.getElementById("name").textContent =
        displayName;


    document.getElementById("displayName").value =
        displayName;


    if (profile?.profile_picture_url) {

        document.getElementById("pictureArea").innerHTML = `

            <img
                src="${profile.profile_picture_url}"
                class="profile-picture"
                alt="Profile picture"
            >

        `;

    }

}


async function saveProfile() {

    if (!currentUser) {
        return;
    }


    const button =
        document.getElementById("saveButton");

    const message =
        document.getElementById("message");


    const displayName =
        document
            .getElementById("displayName")
            .value
            .trim();


    const file =
        document
            .getElementById("profilePicture")
            .files[0];


    if (!displayName) {

        message.textContent =
            "Please enter a display name.";

        return;

    }


    button.disabled = true;

    message.textContent =
        "Saving profile...";


    try {

        let profilePictureUrl = null;


        if (file) {

            if (file.size > 5 * 1024 * 1024) {

                throw new Error(
                    "Please choose an image smaller than 5MB."
                );

            }


            const fileExtension =
                file.name
                    .split(".")
                    .pop()
                    .toLowerCase();


            const filePath =
                currentUser.id +
                "/" +
                Date.now() +
                "." +
                fileExtension;


            const {
                error: uploadError
            } =
                await supabaseClient
                    .storage
                    .from("profile-pictures")
                    .upload(
                        filePath,
                        file,
                        {
                            upsert: true
                        }
                    );


            if (uploadError) {
                throw uploadError;
            }


            const {
                data: publicUrlData
            } =
                supabaseClient
                    .storage
                    .from("profile-pictures")
                    .getPublicUrl(filePath);


            profilePictureUrl =
                publicUrlData.publicUrl;

        }


        const updateData = {
            display_name: displayName
        };


        if (profilePictureUrl) {

            updateData.profile_picture_url =
                profilePictureUrl;

        }


        const {
            error: updateError
        } =
            await supabaseClient
                .from("user_profiles")
                .upsert(
                    {
                        id: currentUser.id,
                        ...updateData
                    }
                );


        if (updateError) {
            throw updateError;
        }


        message.textContent =
            "Profile updated successfully!";


        await loadProfile();


    } catch (error) {

        message.textContent =
            "Error: " + error.message;

    }


    button.disabled = false;

}


loadProfile();

</script>


</body>

</html>
