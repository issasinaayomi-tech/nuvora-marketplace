<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verify Email - NUVORA</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 420px;
            background: white;
            padding: 35px 25px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            text-align: center;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            color: #111827;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 25px;
            color: #111827;
            margin-bottom: 12px;
        }

        .description {
            color: #6b7280;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .email {
            font-weight: bold;
            color: #111827;
            word-break: break-word;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            font-size: 24px;
            text-align: center;
            letter-spacing: 6px;
            outline: none;
        }

        input:focus {
            border-color: #111827;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
        }

        .verify-btn {
            background: #111827;
            color: white;
        }

        .resend-btn {
            background: #e5e7eb;
            color: #111827;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .message {
            margin-top: 18px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: #15803d;
        }

        .error {
            color: #dc2626;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">NUVORA</div>

    <h1>Verify your email</h1>

    <p class="description">
        We sent an 8-digit verification code to:
    </p>

    <div class="email" id="emailDisplay">
        Loading...
    </div>

    <input
        type="text"
        id="code"
        maxlength="8"
        inputmode="numeric"
        autocomplete="one-time-code"
        placeholder="00000000"
    >

    <button
        class="verify-btn"
        id="verifyBtn"
        type="button"
    >
        Verify Email
    </button>

    <button
        class="resend-btn"
        id="resendBtn"
        type="button"
    >
        Resend Code
    </button>

    <div
        class="message"
        id="message"
        aria-live="polite"
    ></div>

</div>

<script>

    /* ==============================
       SUPABASE
    ============================== */

    const SUPABASE_URL =
        "https://rrkbgfdzktoeqiaktzcz.supabase.co";

    const SUPABASE_KEY =
        "sb_publishable_XxydhD3XZ46n378xLbE22w_LTtgAtlV";

    const supabaseClient =
        supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==============================
       ELEMENTS
    ============================== */

    const email =
        localStorage.getItem("nuvoraVerificationEmail");

    const emailDisplay =
        document.getElementById("emailDisplay");

    const codeInput =
        document.getElementById("code");

    const verifyBtn =
        document.getElementById("verifyBtn");

    const resendBtn =
        document.getElementById("resendBtn");

    const message =
        document.getElementById("message");


    /* ==============================
       DISPLAY EMAIL
    ============================== */

    if (!email) {

        emailDisplay.textContent =
            "No email found.";

        verifyBtn.disabled = true;
        resendBtn.disabled = true;

        message.textContent =
            "Please return to the sign-up page and create your account again.";

        message.className =
            "message error";

    } else {

        emailDisplay.textContent = email;

    }


    /* ==============================
       VERIFY 8-DIGIT CODE
    ============================== */

    verifyBtn.addEventListener("click", async function () {

        const code =
            codeInput.value.trim();

        message.textContent = "";
        message.className = "message";


        if (!email) {

            message.textContent =
                "Email address not found.";

            message.className =
                "message error";

            return;
        }


        if (!/^\d{8}$/.test(code)) {

            message.textContent =
                "Please enter the 8-digit verification code.";

            message.className =
                "message error";

            return;
        }


        verifyBtn.disabled = true;
        verifyBtn.textContent = "Verifying...";


        try {

            const { data, error } =
                await supabaseClient.auth.verifyOtp({

                    email: email,

                    token: code,

                    /*
                     * Email OTP verification
                     */
                    type: "email"

                });


            if (error) {

                console.error(
                    "Verification error:",
                    error
                );

                message.textContent =
                    error.message ||
                    "The verification code is invalid or has expired.";

                message.className =
                    "message error";

                verifyBtn.disabled = false;
                verifyBtn.textContent =
                    "Verify Email";

                return;
            }


            /* ==============================
               SUCCESS
            ============================== */

            message.textContent =
                "Email verified successfully! Redirecting...";

            message.className =
                "message success";


            localStorage.removeItem(
                "nuvoraVerificationEmail"
            );


            setTimeout(function () {

                window.location.href =
                    "index.html";

            }, 1500);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong. Please try again.";

            message.className =
                "message error";

            verifyBtn.disabled = false;
            verifyBtn.textContent =
                "Verify Email";

        }

    });


    /* ==============================
       RESEND CODE
    ============================== */

    resendBtn.addEventListener("click", async function () {

        if (!email) {

            message.textContent =
                "Email address not found.";

            message.className =
                "message error";

            return;
        }


        resendBtn.disabled = true;
        resendBtn.textContent = "Sending...";

        message.textContent = "";
        message.className = "message";


        try {

            const { error } =
                await supabaseClient.auth.resend({

                    type: "signup",

                    email: email

                });


            if (error) {

                console.error(
                    "Resend error:",
                    error
                );

                message.textContent =
                    error.message ||
                    "Unable to resend the code.";

                message.className =
                    "message error";

                resendBtn.disabled = false;
                resendBtn.textContent =
                    "Resend Code";

                return;
            }


            message.textContent =
                "A new 8-digit verification code has been sent.";

            message.className =
                "message success";


            resendBtn.textContent =
                "Code Sent";


            /*
             * Wait 60 seconds before allowing
             * another resend.
             */
            setTimeout(function () {

                resendBtn.disabled = false;

                resendBtn.textContent =
                    "Resend Code";

            }, 60000);


        } catch (error) {

            console.error(error);

            message.textContent =
                "Something went wrong while sending the code.";

            message.className =
                "message error";

            resendBtn.disabled = false;
            resendBtn.textContent =
                "Resend Code";

        }

    });


    /* ==============================
       NUMBERS ONLY
    ============================== */

    codeInput.addEventListener("input", function () {

        this.value =
            this.value
            .replace(/\D/g, "")
            .slice(0, 8);

    });

</script>

</body>
</html>
