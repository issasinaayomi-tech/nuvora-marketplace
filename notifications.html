<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NUVORA - Notifications</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
        }

        header {
            background: #111827;
            color: white;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .back-btn {
            color: white;
            text-decoration: none;
            font-size: 14px;
        }

        main {
            max-width: 700px;
            margin: 30px auto;
            padding: 0 16px;
        }

        .top {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 10px;
        }

        h1 {
            font-size: 26px;
        }

        #markAllBtn {
            border: none;
            background: #e8790c;
            color: white;
            padding: 10px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        #markAllBtn:hover {
            opacity: 0.9;
        }

        #notifications {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .notification {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 12px;
            padding: 16px;
            cursor: pointer;
            transition: 0.2s;
        }

        .notification:hover {
            border-color: #e8790c;
        }

        .notification.unread {
            border-left: 4px solid #e8790c;
            background: #fff8ef;
        }

        .notification-title {
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 16px;
        }

        .notification-message {
            color: #4b5563;
            line-height: 1.5;
            font-size: 14px;
        }

        .notification-time {
            margin-top: 8px;
            color: #9ca3af;
            font-size: 12px;
        }

        .empty {
            background: white;
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            color: #6b7280;
        }

        .login-box {
            background: white;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
        }

        .login-box a {
            display: inline-block;
            margin-top: 15px;
            background: #e8790c;
            color: white;
            text-decoration: none;
            padding: 10px 18px;
            border-radius: 8px;
        }

        @media (max-width: 500px) {
            .top {
                align-items: flex-start;
                flex-direction: column;
            }

            #markAllBtn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

<header>
    <div class="logo">NUVORA</div>
    <a class="back-btn" href="index.html">← Back to Home</a>
</header>

<main>

    <div class="top">
        <h1>Notifications</h1>

        <button id="markAllBtn" type="button">
            Mark all as read
        </button>
    </div>

    <div id="notifications">
        <div class="empty">
            Loading notifications...
        </div>
    </div>

</main>

<script>

const SUPABASE_URL =
    "https://rrkbgfdzktoeqiaktzcz.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_XxydhD3XZ46n378xLbE22w_LTtgAtlV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );

let currentUser = null;


// -----------------------------
// GET CURRENT USER
// -----------------------------

async function getCurrentUser() {

    const {
        data: { user },
        error
    } = await supabaseClient.auth.getUser();

    if (error || !user) {

        document.getElementById("notifications").innerHTML = `
            <div class="login-box">
                <h2>Please log in</h2>

                <p style="margin-top:10px;color:#6b7280;">
                    You need to be logged in to view your notifications.
                </p>

                <a href="login.html">
                    Log In
                </a>
            </div>
        `;

        document.getElementById("markAllBtn").style.display = "none";

        return false;
    }

    currentUser = user;

    return true;
}


// -----------------------------
// LOAD NOTIFICATIONS
// -----------------------------

async function loadNotifications() {

    const container =
        document.getElementById("notifications");

    const {
        data,
        error
    } = await supabaseClient
        .from("notifications")
        .select("*")
        .eq("user_id", currentUser.id)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        container.innerHTML = `
            <div class="empty">
                Unable to load notifications.
            </div>
        `;

        return;
    }


    if (!data || data.length === 0) {

        container.innerHTML = `
            <div class="empty">
                🔔<br><br>
                You have no notifications yet.
            </div>
        `;

        return;
    }


    container.innerHTML = "";


    data.forEach(notification => {

        const item =
            document.createElement("div");

        item.className =
            "notification " +
            (notification.is_read ? "" : "unread");


        item.innerHTML = `

            <div class="notification-title">
                ${getNotificationIcon(notification.type)}
                ${escapeHtml(notification.title)}
            </div>

            <div class="notification-message">
                ${escapeHtml(notification.message)}
            </div>

            <div class="notification-time">
                ${formatTime(notification.created_at)}
            </div>

        `;


        item.addEventListener(
            "click",
            () => handleNotification(notification)
        );


        container.appendChild(item);

    });

}


// -----------------------------
// NOTIFICATION ICON
// -----------------------------

function getNotificationIcon(type) {

    if (type === "message") {
        return "💬";
    }

    if (type === "offer") {
        return "💰";
    }

    if (type === "order") {
        return "🛒";
    }

    if (type === "delivery") {
        return "🚚";
    }

    return "🔔";
}


// -----------------------------
// HANDLE NOTIFICATION
// -----------------------------

async function handleNotification(notification) {

    if (!notification.is_read) {

        await supabaseClient
            .from("notifications")
            .update({
                is_read: true
            })
            .eq("id", notification.id)
            .eq("user_id", currentUser.id);

    }


    if (notification.conversation_id) {

        window.location.href =
            "messages.html?conversation=" +
            encodeURIComponent(
                notification.conversation_id
            );

        return;
    }


    if (notification.product_id) {

        window.location.href =
            "product.html?id=" +
            encodeURIComponent(
                notification.product_id
            );

        return;
    }


    await loadNotifications();

}


// -----------------------------
// MARK ALL AS READ
// -----------------------------

document
    .getElementById("markAllBtn")
    .addEventListener("click", async () => {

        const {
            error
        } = await supabaseClient
            .from("notifications")
            .update({
                is_read: true
            })
            .eq("user_id", currentUser.id)
            .eq("is_read", false);


        if (error) {

            console.error(error);

            alert(
                "Unable to mark notifications as read."
            );

            return;
        }


        loadNotifications();

    });


// -----------------------------
// TIME FORMAT
// -----------------------------

function formatTime(dateString) {

    const date =
        new Date(dateString);

    return date.toLocaleString(
        undefined,
        {
            dateStyle: "medium",
            timeStyle: "short"
        }
    );

}


// -----------------------------
// SECURITY
// -----------------------------

function escapeHtml(value) {

    return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


// -----------------------------
// START
// -----------------------------

async function start() {

    const loggedIn =
        await getCurrentUser();

    if (!loggedIn) {
        return;
    }

    await loadNotifications();

}

start();

</script>

</body>
</html>
